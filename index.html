<title>Consultorios Antonelli 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: full-bleed 3D canvas, floating control strips on top (title + view mode, toggles) and bottom (room jump chips). */
:root {
  --bg: #e9eced;
  --scene: #e9eced;
  --ground: #d9dfe0;
  --panel: #fbfcfc;
  --ink: #1b2a2f;
  --muted: #5b6d73;
  --line: #ccd5d7;
  --accent: #0b7f86;
  --accent-ink: #ffffff;
  --accent-soft: #d5ecee;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a1d; --scene: #131a1d; --ground: #1b2528; --panel: #1c272b; --ink: #e5eeee;
    --muted: #94a7ac; --line: #324349; --accent: #3cc0c7; --accent-ink: #04262a; --accent-soft: #1f4247;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a1d; --scene: #131a1d; --ground: #1b2528; --panel: #1c272b; --ink: #e5eeee;
  --muted: #94a7ac; --line: #324349; --accent: #3cc0c7; --accent-ink: #04262a; --accent-soft: #1f4247;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; overflow: hidden; }
#app { position: relative; height: 100%; width: 100%; }
canvas#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.top, .bottom { position: absolute; left: 0; right: 0; padding-inline: 16px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.top { top: 12px; }
.bottom { bottom: 12px; }
.top > *, .bottom > * { pointer-events: auto; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.brand { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; min-width: 0; }
.brand b { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .02em; line-height: 1.05; text-transform: uppercase; }
.brand span { font-size: 11px; color: var(--muted); }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px; gap: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 4px; font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip:disabled { opacity: .4; cursor: default; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); border-radius: 6px; padding: 5px 10px; align-self: flex-start; }
.rooms { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.rooms .lbl { font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; color: var(--muted); align-self: center; padding-right: 4px; white-space: nowrap; }
.sel { align-self: center; background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; max-width: 100%; }
.sel b { font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.sel code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pad { position: absolute; right: 16px; bottom: 76px; display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 48px); gap: 6px; }
.pad button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; font-size: 18px; touch-action: none; user-select: none; }
.pad button:active { background: var(--accent-soft); }
.pad .u { grid-column: 2; grid-row: 1; } .pad .l { grid-column: 1; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 2; } .pad .r { grid-column: 3; grid-row: 2; }
.scale { position: absolute; right: 16px; top: 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); display: none; }
@media (max-width: 560px) { .brand b { font-size: 17px; } .seg button { padding: 6px 11px; font-size: 15px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div id="app">
  <canvas id="view" tabindex="0" aria-label="3D model of the dental clinic"></canvas>

  <div class="top">
    <div class="row">
      <div class="brand"><b>Consultorios Antonelli</b><span>Dra. Ludmila Antonelli · propuesta elegida 14/10/26</span></div>
      <div class="seg" role="group" aria-label="View mode">
        <button id="m-orbit" aria-pressed="true">Orbit</button>
        <button id="m-top" aria-pressed="false">Top</button>
        <button id="m-walk" aria-pressed="false">Walk</button>
      </div>
    </div>
    <div class="row">
      <button class="chip" id="t-roof" aria-pressed="false">Roof: off</button>
      <button class="chip" id="t-walls" aria-pressed="false">Walls: full</button>
      <button class="chip" id="t-labels" aria-pressed="true">Labels</button>
      <button class="chip" id="t-move" aria-pressed="false">Move furniture: off</button>
      <button class="chip" id="t-reset">Reset layout</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="pad" id="pad" hidden>
    <button class="u" data-k="fwd" aria-label="Forward">▲</button>
    <button class="l" data-k="left" aria-label="Turn left">◀</button>
    <button class="d" data-k="back" aria-label="Back">▼</button>
    <button class="r" data-k="right" aria-label="Turn right">▶</button>
  </div>

  <div class="bottom">
    <div class="sel" id="sel" hidden>
      <b id="sel-name"></b><code id="sel-pos"></code>
      <button class="chip primary" id="sel-rot">Rotate 90° (R)</button>
      <button class="chip" id="sel-done">Done</button>
    </div>
    <div class="rooms" id="rooms"><span class="lbl">Go to</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // ---- plan coordinates: pixels of the PDF -> meters (80 px per meter, origin at the NW outer corner)
  const S = 80, OX = 95, OZ = 268;
  const X = px => (px - OX) / S, Z = py => (py - OZ) / S;
  const H = 2.6, T = 0.12;

  const canvas = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 120);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8f9a9c, 0.95));
  const sun = new THREE.DirectionalLight(0xfff6ea, 0.75);
  sun.position.set(-3, 14, 12); sun.target.position.set(4, 0, 4.5);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 });
  sun.shadow.bias = -0.0006;
  scene.add(sun, sun.target);

  // ---- materials & textures
  const mat = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.75, metalness: 0 }, o || {}));
  const LIGHT_PANEL = new THREE.MeshBasicMaterial({ color: 0xfffbf0 });
  const M = {
    wall: mat(0xf2f0ea, { roughness: .9 }), white: mat(0xf5f5f2), grey: mat(0xd9dede), steel: mat(0x9aa5a8, { metalness: .5, roughness: .4 }),
    oak: mat(0xc79d6a), dark: mat(0x2d3538), teal: mat(0x2f7f86), fabric: mat(0x6b8087), tealLight: mat(0x8fc7cb),
    glass: mat(0x9fd3dc, { transparent: true, opacity: 0.28, roughness: 0.1, depthWrite: false }),
    yellow: mat(0xf2c230), roof: mat(0xfafaf8, { side: THREE.DoubleSide })
  };
  function canvasTex(size, draw) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    draw(c.getContext('2d'), size);
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
  }
  const texWood = canvasTex(256, (g, s) => {
    const n = 8, h = s / n; let r = 3;
    const rnd = () => { r = (r * 16807) % 2147483647; return r / 2147483647; };
    for (let i = 0; i < n; i++) {
      const v = 196 + Math.round((rnd() - .5) * 26);
      g.fillStyle = `rgb(${v + 6},${v - 26},${v - 70})`; g.fillRect(0, i * h, s, h);
      for (let k = 0; k < 14; k++) { g.fillStyle = `rgba(90,55,25,${.05 + rnd() * .08})`; g.fillRect(rnd() * s, i * h + rnd() * h, 30 + rnd() * 120, 1); }
      g.fillStyle = 'rgba(60,35,15,.5)'; g.fillRect(0, i * h, s, 1.5); g.fillRect((i * 97 + rnd() * 50) % s, i * h, 1.5, h);
    }
  });
  const texTile = canvasTex(128, (g, s) => {
    g.fillStyle = '#e8eeef'; g.fillRect(0, 0, s, s);
    g.strokeStyle = '#bfcace'; g.lineWidth = 3; g.strokeRect(0, 0, s, s); g.strokeRect(s / 2, 0, 0, s); g.beginPath(); g.moveTo(0, s / 2); g.lineTo(s, s / 2); g.moveTo(s / 2, 0); g.lineTo(s / 2, s); g.stroke();
  });
  const texDeck = canvasTex(128, (g, s) => {
    g.fillStyle = '#b4b1a9'; g.fillRect(0, 0, s, s);
    g.strokeStyle = '#8f8c85'; g.lineWidth = 3; g.strokeRect(0, 0, s, s);
  });
  const floorTypes = {
    wood: { tex: texWood, per: 1.0 }, tile: { tex: texTile, per: 0.6 }, deck: { tex: texDeck, per: 0.5 }, vinyl: { color: 0xe0dcd3 }
  };

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshStandardMaterial({ color: 0xd9dfe0, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(4, -0.03, 4.5); ground.receiveShadow = true; scene.add(ground);

  // ---- floors (px rects)
  const FLOORS = [
    [100, 270, 330, 600, 'vinyl'], [100, 600, 330, 750, 'vinyl'], [100, 750, 330, 990, 'deck'],
    [330, 270, 532, 515, 'vinyl'], [330, 515, 532, 600, 'wood'], [417, 600, 532, 620, 'wood'],
    [532, 270, 737, 750, 'wood'], [500, 620, 532, 750, 'wood'], [500, 750, 585, 850, 'wood'],
    [330, 600, 417, 735, 'tile'], [417, 620, 500, 735, 'tile'], [330, 735, 500, 780, 'tile'],
    [330, 780, 500, 990, 'tile'], [500, 850, 585, 990, 'tile'], [335, 170, 670, 268, 'deck'], [585, 750, 737, 850, 'deck']
  ];
  FLOORS.forEach(([x1, y1, x2, y2, type]) => {
    const w = (x2 - x1) / S, d = (y2 - y1) / S, f = floorTypes[type];
    let m;
    if (f.tex) { const t = f.tex.clone(); t.needsUpdate = true; t.repeat.set(w / f.per, d / f.per); m = mat(0xffffff, { map: t, roughness: .85 }); }
    else m = mat(f.color, { roughness: .9 });
    const p = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m);
    p.rotation.x = -Math.PI / 2; p.position.set(X((x1 + x2) / 2), 0, Z((y1 + y2) / 2)); p.receiveShadow = true; scene.add(p);
  });

  // ---- walls (px, axis-aligned). gaps: [from, to, type] along the wall
  const WALLS = [
    { x1: 100, y1: 270, x2: 737, y2: 270, gaps: [[150, 280, 'win'], [375, 500, 'win'], [575, 690, 'win']] },
    { x1: 100, y1: 270, x2: 100, y2: 990 }, { x1: 737, y1: 270, x2: 737, y2: 750 }, { x1: 585, y1: 750, x2: 737, y2: 750 },
    { x1: 585, y1: 750, x2: 585, y2: 990, gaps: [[775, 845, 'door']] }, { x1: 100, y1: 990, x2: 585, y2: 990 },
    { x1: 330, y1: 270, x2: 330, y2: 990, gaps: [[538, 600, 'door'], [640, 705, 'door']] },
    { x1: 100, y1: 600, x2: 330, y2: 600, gaps: [[120, 310, 'glass']] },
    { x1: 100, y1: 750, x2: 330, y2: 750, gaps: [[265, 325, 'door']] },
    { x1: 330, y1: 515, x2: 532, y2: 515, gaps: [[405, 455, 'door']] },
    { x1: 532, y1: 270, x2: 532, y2: 515, gaps: [[375, 450, 'door']] },
    { x1: 330, y1: 600, x2: 417, y2: 600 }, { x1: 417, y1: 600, x2: 417, y2: 735 },
    { x1: 417, y1: 620, x2: 500, y2: 620, gaps: [[440, 490, 'door']] }, { x1: 500, y1: 620, x2: 500, y2: 850 },
    { x1: 330, y1: 735, x2: 500, y2: 735 }, { x1: 330, y1: 780, x2: 500, y2: 780, gaps: [[345, 440, 'door']] },
    { x1: 500, y1: 850, x2: 585, y2: 850, gaps: [[512, 565, 'door']] }
  ];
  // ---- geometry helpers (rounded boxes, lathe, tubes)
  const geoCache = {};
  function rgeo(w, h, d, r) {
    r = Math.max(0.002, Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001));
    const key = [w, h, d, r].map(v => v.toFixed(3)).join();
    if (geoCache[key]) return geoCache[key];
    const s = new THREE.Shape(), x = -w / 2 + r, y = -h / 2 + r, ww = w - 2 * r, hh = h - 2 * r;
    s.moveTo(x, y); s.lineTo(x + ww, y); s.lineTo(x + ww, y + hh); s.lineTo(x, y + hh); s.closePath();
    const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(d - 2 * r, 0.001), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 4, curveSegments: 1 });
    g.translate(0, 0, -(d - 2 * r) / 2); g.computeVertexNormals();
    return (geoCache[key] = g);
  }
  function bx(g, w, h, d, m, x, y, z, rx, r) {
    const o = new THREE.Mesh(rgeo(w, h, d, r == null ? 0.012 : r), m); o.position.set(x, y, z); if (rx) o.rotation.x = rx; g.add(o); return o;
  }
  function cy(g, rt, rb, h, m, x, y, z) { const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 32), m); o.position.set(x, y, z); g.add(o); return o; }
  function lathe(g, pts, m, x, y, z) {
    const o = new THREE.Mesh(new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), 40), m); o.position.set(x || 0, y || 0, z || 0); g.add(o); return o;
  }
  function tube(g, pts, rad, m) {
    const c = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])));
    const o = new THREE.Mesh(new THREE.TubeGeometry(c, 28, rad, 10, false), m); g.add(o); return o;
  }

  // ---- walls with skirting, door frames + open door leaves, window frames
  const colliders = [];
  const skirtMat = mat(0xffffff, { roughness: .5 }), doorMat = mat(0xf8f7f3, { roughness: .45 });
  function buildWalls(h, full) {
    const g = new THREE.Group(); let doorN = 0;
    const box = (w, hh, d, m, x, y, z) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, hh, d), m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; g.add(o); return o; };
    WALLS.forEach(w => {
      const horiz = w.y1 === w.y2;
      const a = horiz ? w.x1 : w.y1, b = horiz ? w.x2 : w.y2, fx = horiz ? Z(w.y1) : X(w.x1);
      const conv = horiz ? X : Z;
      const gaps = (w.gaps || []).slice().sort((p, q) => p[0] - q[0]);
      const put = (from, to, y0, y1, material, solid) => {
        let lo = conv(from), hi = conv(to);
        if (from === a) lo -= T / 2; if (to === b) hi += T / 2;
        const len = hi - lo, hh = y1 - y0; if (len <= 0.001 || hh <= 0.001) return;
        const cx = (lo + hi) / 2;
        const mesh = box(horiz ? len : T, hh, horiz ? T : len, material, horiz ? cx : fx, y0 + hh / 2, horiz ? fx : cx);
        if (material === M.glass) mesh.castShadow = false;
        else if (y0 === 0) box(horiz ? len : T + .02, .09, horiz ? T + .02 : len, skirtMat, horiz ? cx : fx, .045, horiz ? fx : cx).castShadow = false;
        if (full && solid) colliders.push(horiz ? { x1: lo, x2: hi, z1: fx - T / 2, z2: fx + T / 2 } : { x1: fx - T / 2, x2: fx + T / 2, z1: lo, z2: hi });
      };
      const frame = (lo, hi, y0, y1) => {
        const fw = .05, fd = T + .03;
        const post = (c, ) => horiz ? box(fw, y1 - y0, fd, doorMat, c, (y0 + y1) / 2, fx) : box(fd, y1 - y0, fw, doorMat, fx, (y0 + y1) / 2, c);
        post(lo + fw / 2); post(hi - fw / 2);
        const len = hi - lo;
        if (horiz) box(len, fw, fd, doorMat, (lo + hi) / 2, y1 - fw / 2, fx); else box(fd, fw, len, doorMat, fx, y1 - fw / 2, (lo + hi) / 2);
        if (y0 > 0) { if (horiz) box(len, fw, fd + .04, doorMat, (lo + hi) / 2, y0 + fw / 2, fx); else box(fd + .04, fw, len, doorMat, fx, y0 + fw / 2, (lo + hi) / 2); }
      };
      let cur = a;
      gaps.forEach(([ga, gb, type]) => {
        if (ga > cur) put(cur, ga, 0, h, M.wall, true);
        const sill = type === 'win' ? 0.9 : type === 'glass' ? 0.05 : 0, lo = conv(ga), hi = conv(gb);
        if (full) {
          if (type === 'door') {
            put(ga, gb, 2.1, h, M.wall, false); frame(lo, hi, 0, 2.1);
            const wd = hi - lo - .1, pivot = new THREE.Group(), leaf = new THREE.Mesh(rgeo(horiz ? wd : .04, 2.03, horiz ? .04 : wd, .008), doorMat);
            leaf.castShadow = true; leaf.position.set(horiz ? wd / 2 : 0, 1.015, horiz ? 0 : wd / 2);
            const hnd = new THREE.Mesh(new THREE.SphereGeometry(.025, 10, 8), M.steel); hnd.position.set(horiz ? wd - .07 : .04, 1.0 - 1.015, horiz ? .04 : wd - .07); leaf.add(hnd);
            pivot.add(leaf); pivot.position.set(horiz ? lo + .05 : fx, 0, horiz ? fx : lo + .05);
            pivot.rotation.y = (doorN++ % 2 ? 1 : -1) * 1.3; g.add(pivot);
          } else {
            put(ga, gb, 0, sill, M.wall, true); put(ga, gb, 2.1, h, M.wall, false); put(ga, gb, sill, 2.1, M.glass, true);
            frame(lo, hi, sill, 2.1);
            if (hi - lo > 1.4) { const mc = (lo + hi) / 2; if (horiz) box(.04, 2.1 - sill, T * .5, doorMat, mc, (sill + 2.1) / 2, fx); else box(T * .5, 2.1 - sill, .04, doorMat, fx, (sill + 2.1) / 2, mc); }
          }
        } else if (type === 'win') put(ga, gb, 0, Math.min(sill, h), M.wall, false);
        cur = gb;
      });
      if (cur < b) put(cur, b, 0, h, M.wall, true);
    });
    return g;
  }
  const wallsFull = buildWalls(H, true), wallsCut = buildWalls(1.05, false);
  scene.add(wallsFull, wallsCut);

  // ---- roof (not over patio, balcony, corridor)
  const roof = new THREE.Group();
  [[100, 270, 737, 750], [330, 750, 585, 990]].forEach(([x1, y1, x2, y2]) => {
    const r = new THREE.Mesh(new THREE.BoxGeometry((x2 - x1) / S + T, 0.1, (y2 - y1) / S + T), M.roof);
    r.position.set(X((x1 + x2) / 2), H + 0.05, Z((y1 + y2) / 2)); roof.add(r);
  });
  // ceiling light panels (visible with the roof on)
  [[215, 430], [430, 390], [430, 560], [635, 400], [635, 620], [215, 675], [545, 800], [415, 880], [415, 940], [545, 920], [372, 665], [458, 680]].forEach(([px, py]) => {
    const p = new THREE.Mesh(new THREE.BoxGeometry(.7, .03, .35), LIGHT_PANEL); p.position.set(X(px), H - .01, Z(py)); roof.add(p);
  });
  scene.add(roof);

  // balcony railing
  [[335, 170, 670, 172], [335, 170, 337, 268], [668, 170, 670, 268]].forEach(([x1, y1, x2, y2]) => {
    const r = new THREE.Mesh(new THREE.BoxGeometry(Math.max((x2 - x1) / S, 0.05), 1.0, Math.max((y2 - y1) / S, 0.05)), M.glass);
    r.position.set(X((x1 + x2) / 2), 0.5, Z((y1 + y2) / 2)); scene.add(r);
  });

    document.getElementById('t-move').disabled = w; document.getElementById('t-reset').disabled = w;
    ['t-roof', 't-walls', 't-labels'].forEach(id => document.getElementById(id).disabled = w);
    document.getElementById('pad').hidden = !w;
  }
  const hints = {
    orbit: 'Drag the floor to orbit · right-drag or two fingers to pan · scroll or pinch to zoom · turn on Move furniture to drag pieces',
    top: 'Plan view · turn on Move furniture to drag pieces · right-drag or two fingers to pan · scroll or pinch to zoom',
    walk: 'Drag to look around · W A S D or arrow keys to walk · Shift to run · pick a room below to jump there'
  };
  function fitR() { return 14 * Math.max(1, 1.2 / camera.aspect); }
  function setMode(m) {
    st.mode = m; deselect();
    ['orbit', 'top', 'walk'].forEach(k => document.getElementById('m-' + k).setAttribute('aria-pressed', k === m));
    if (m === 'top') { goal.ph = 0.02; goal.th = 0; goal.r = fitR(); goal.tx = 4; goal.tz = 4.6; if (st.roof) { st.roof = false; } }
    if (m === 'orbit' && goal.ph < 0.3) goal.ph = 0.95;
    document.getElementById('hint').textContent = hints[m]; applyVis();
  }
  function jump(r) {
    if (st.mode === 'walk') { walk.x = X(r.w[0]); walk.z = Z(r.w[1]); walk.yaw = r.w[2]; walk.pitch = 0; }
    else { goal.tx = X(r.l[0]); goal.tz = Z(r.l[1]); goal.r = 7.5; if (st.mode === 'orbit') goal.ph = 0.85; }
  }
  const roomsEl = document.getElementById('rooms');
  ROOMS.filter(r => r.goto !== false).forEach(r => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = r.n; b.addEventListener('click', () => jump(r)); roomsEl.appendChild(b);
  });
  document.getElementById('m-orbit').onclick = () => setMode('orbit');
  document.getElementById('m-top').onclick = () => setMode('top');
  document.getElementById('m-walk').onclick = () => { setMode('walk'); jump(ROOMS[0]); };
  document.getElementById('t-roof').onclick = () => { st.roof = !st.roof; applyVis(); };
  document.getElementById('t-walls').onclick = () => { st.walls = st.walls === 'full' ? 'cut' : st.walls === 'cut' ? 'off' : 'full'; applyVis(); };
  document.getElementById('t-labels').onclick = () => { st.labels = !st.labels; applyVis(); };
  document.getElementById('t-move').onclick = () => { st.move = !st.move; if (!st.move) deselect(); applyVis(); };
  document.getElementById('t-reset').onclick = () => { items.forEach(g => { g.position.set(g.userData.home.x, 0, g.userData.home.z); g.rotation.y = g.userData.home.r; }); deselect(); };

  // ---- selection
  let selected = null, ring = null;
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x0b7f86, transparent: true, opacity: .9, depthTest: false, side: THREE.DoubleSide });
  function select(g) {
    deselect(); selected = g;
    const sz = g.userData.size;
    const rad = Math.max(.3, Math.min(1.4, Math.max(sz.x, sz.z) / 2 * 1.08));
    ring = new THREE.Mesh(new THREE.RingGeometry(rad, rad + .05, 48), ringMat); ring.rotation.x = -Math.PI / 2; ring.position.y = .03; ring.renderOrder = 5; ring.raycast = () => {};
    g.add(ring); updateSel(); document.getElementById('sel').hidden = false; document.getElementById('sel-name').textContent = g.userData.item;
  }
  function deselect() { if (ring && selected) selected.remove(ring); selected = ring = null; document.getElementById('sel').hidden = true; }
  function updateSel() { if (selected) document.getElementById('sel-pos').textContent = `x ${selected.position.x.toFixed(2)} m · z ${selected.position.z.toFixed(2)} m`; }
  function rotateSel() { if (selected) selected.rotation.y += Math.PI / 2; }
  document.getElementById('sel-rot').onclick = rotateSel; document.getElementById('sel-done').onclick = deselect;

  // ---- input
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  function setRay(e) { const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); }
  function pickItem(e) {
    setRay(e); const hits = ray.intersectObjects(items, true);
    for (const h of hits) { let o = h.object; while (o && !o.userData.item) o = o.parent; if (o) return o; }
    return null;
  }
  const ptrs = new Map(); let gesture = null, pinch = 0, dragOff = new THREE.Vector3(), lastMid = null;
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) { const p = [...ptrs.values()]; pinch = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); lastMid = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 }; gesture = 'pinch'; return; }
    if (st.mode === 'walk') { gesture = 'look'; return; }
    const hit = e.button === 0 && st.move ? pickItem(e) : null;
    if (hit && !e.shiftKey) {
      select(hit); gesture = 'item'; const p = new THREE.Vector3(); ray.ray.intersectPlane(plane, p); dragOff.copy(hit.position).sub(p); canvas.style.cursor = 'grabbing';
    } else gesture = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
  });
  canvas.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId);
    if (!p) { if (st.move && st.mode !== 'walk' && e.pointerType === 'mouse') canvas.style.cursor = pickItem(e) ? 'grab' : 'default'; return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (gesture === 'pinch' && ptrs.size === 2) {
      const q = [...ptrs.values()], d = Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y), mid = { x: (q[0].x + q[1].x) / 2, y: (q[0].y + q[1].y) / 2 };
      if (st.mode !== 'walk') { goal.r = clamp(goal.r * pinch / d, 3, 32); doPan(mid.x - lastMid.x, mid.y - lastMid.y); }
      pinch = d; lastMid = mid; return;
    }
    if (gesture === 'item' && selected) {
      setRay(e); const pt = new THREE.Vector3();
      if (ray.ray.intersectPlane(plane, pt)) { selected.position.x = clamp(pt.x + dragOff.x, 0.1, 7.95); selected.position.z = clamp(pt.z + dragOff.z, -1.1, 8.9); updateSel(); }
    } else if (gesture === 'orbit') { goal.th -= dx * 0.006; goal.ph = clamp(goal.ph - dy * 0.006, 0.02, 1.5); if (st.mode === 'top' && Math.abs(dy) + Math.abs(dx) > 0) { /* stay in top mode but allow tilt */ } }
    else if (gesture === 'pan') doPan(dx, dy);
    else if (gesture === 'look') { walk.yaw -= dx * 0.004; walk.pitch = clamp(walk.pitch - dy * 0.004, -1.2, 1.2); }
  });
  function endPtr(e) { ptrs.delete(e.pointerId); if (ptrs.size === 0) { gesture = null; canvas.style.cursor = 'default'; } else if (ptrs.size === 1) gesture = st.mode === 'walk' ? 'look' : 'orbit'; }
  canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
  canvas.addEventListener('wheel', e => { e.preventDefault(); if (st.mode !== 'walk') goal.r = clamp(goal.r * Math.exp(e.deltaY * 0.001), 3, 32); }, { passive: false });
  function doPan(dx, dy) {
    const k = goal.r * 0.0017, th = goal.th;
    goal.tx = clamp(goal.tx - Math.cos(th) * dx * k - Math.sin(th) * dy * k, -4, 12);
    goal.tz = clamp(goal.tz + Math.sin(th) * dx * k - Math.cos(th) * dy * k, -3, 13);
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'r') rotateSel(); else if (k === 'escape') deselect();
    keys[k] = true; if (st.mode === 'walk' && ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  document.querySelectorAll('#pad button').forEach(b => {
    const k = 'pad-' + b.dataset.k;
    b.addEventListener('pointerdown', e => { e.preventDefault(); keys[k] = true; b.setPointerCapture(e.pointerId); });
    ['pointerup', 'pointercancel'].forEach(t => b.addEventListener(t, () => { keys[k] = false; }));
  });

  function blocked(x, z, r) { for (const c of colliders) if (x > c.x1 - r && x < c.x2 + r && z > c.z1 - r && z < c.z2 + r) return true; return false; }
  function stepWalk(dt) {
    const run = keys.shift ? 2 : 1, sp = 1.5 * run * dt;
    let f = 0, s = 0, turn = 0;
    if (keys.w || keys.arrowup || keys['pad-fwd']) f += 1; if (keys.s || keys.arrowdown || keys['pad-back']) f -= 1;
    if (keys.d) s += 1; if (keys.a) s -= 1;
    if (keys.arrowleft || keys['pad-left']) turn += 1; if (keys.arrowright || keys['pad-right']) turn -= 1;
    walk.yaw += turn * 1.6 * dt;
    const fx = -Math.sin(walk.yaw), fz = -Math.cos(walk.yaw), rx = Math.cos(walk.yaw), rz = -Math.sin(walk.yaw);
    const mx = (fx * f + rx * s) * sp, mz = (fz * f + rz * s) * sp, R = 0.22;
    if (!blocked(walk.x + mx, walk.z, R)) walk.x += mx;
    if (!blocked(walk.x, walk.z + mz, R)) walk.z += mz;
  }

  // ---- theme
  function applyTheme() {
    const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
    scene.background = new THREE.Color(v('--scene')); ground.material.color.set(v('--ground')); ringMat.color.set(v('--accent'));
  }
  applyTheme();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---- loop
  function resize() {
    const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false);
    camera.aspect = r.width / Math.max(r.height, 1); camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(canvas); resize();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (st.mode === 'walk') {
      stepWalk(dt); camera.position.set(walk.x, 1.6, walk.z); camera.rotation.set(walk.pitch, walk.yaw, 0, 'YXZ');
    } else {
      const k = 1 - Math.pow(0.0005, dt);
      ['th', 'ph', 'r', 'tx', 'tz'].forEach(p => cam[p] += (goal[p] - cam[p]) * k);
      const sp = Math.sin(cam.ph);
      camera.position.set(cam.tx + cam.r * sp * Math.sin(cam.th), cam.ty + cam.r * Math.cos(cam.ph), cam.tz + cam.r * sp * Math.cos(cam.th));
      camera.up.set(0, 1, 0); camera.lookAt(cam.tx, cam.ty, cam.tz);
    }
    renderer.render(scene, camera); requestAnimationFrame(frame);
  }
  goal.r = cam.r = fitR(); setMode('orbit'); applyVis(); requestAnimationFrame(frame);
})();
</script>
